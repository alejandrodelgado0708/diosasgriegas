services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control_horario
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - control_horario_data:/var/lib/postgresql/data

volumes:
  control_horario_data:
